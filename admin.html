<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HOF | Admin Dashboard</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script defer src="admin.js"></script></head>
<body class="admin-page"><header class="site-header"><a class="brand" href="index.html">HOF<span>HOME OF FABRIC</span></a><nav><a href="index.html">VIEW STORE ↗</a></nav></header><main class="admin-wrap">
<section id="login-panel" class="admin-panel"><p class="eyebrow">PRIVATE MANAGEMENT</p><h1>Admin sign in</h1><p class="muted">Authorised HOF administrator access only.</p><form id="login-form" class="admin-form"><label>Email<input id="email" type="email" autocomplete="username" required></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><button class="button button-dark" id="login-button" type="submit">SIGN IN</button></form><p id="login-message" class="status" role="status"></p></section>
<section id="dashboard" class="hidden"><div class="admin-title"><div><p class="eyebrow">PRIVATE MANAGEMENT</p><h1>Product dashboard</h1></div><button id="logout" class="outline-button">SIGN OUT</button></div>
<section class="admin-panel"><h2 id="form-title">Add a product</h2><form id="product-form" class="admin-form"><input type="hidden" id="product-id"><div class="form-grid"><label>Product name<input id="name" maxlength="120" required></label><label>Price (₦)<input id="price" type="number" min="0" step="0.01" required></label><label>Category<select id="category" required><option value="">Choose category</option><option>Luxury Lace</option><option>Swiss Voile</option><option>Atiku</option><option>Getzner</option><option>Shadda</option><option>Wagambari</option><option>Voil</option><option>Senator Materials</option><option>Men's Caps</option><option>Accessories</option><option>Other Fabrics</option></select></label><label>Price unit<select id="unit"><option value="yard">Per yard</option><option value="set">Per set</option><option value="piece">Per piece</option><option value="item">Per item</option></select></label><label class="full">Description<textarea id="description" rows="3"></textarea></label><label class="full">Product photos<input id="images" type="file" accept="image/*" multiple><small>New photos are added to existing photos when editing. Maximum 10 MB each.</small></label></div><div class="checks"><label><input id="available" type="checkbox" checked> Available</label><label><input id="new-arrival" type="checkbox"> New arrival</label></div><div class="admin-actions"><button class="button button-dark" id="save-button" type="submit">SAVE PRODUCT</button><button class="outline-button hidden" id="cancel-edit" type="button">CANCEL EDIT</button></div></form><p id="form-message" class="status" role="status"></p></section>
<section class="admin-panel"><div class="admin-title"><h2>Your catalogue</h2><button id="refresh" class="outline-button">REFRESH</button></div><div id="product-list" class="admin-products"></div><p id="list-message" class="status" role="status"></p></section></section></main><footer class="site-footer">HOF · HOME OF FABRIC</footer></body></html>
